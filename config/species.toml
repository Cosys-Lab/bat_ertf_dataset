# Species of the dataset. Meshes: data/meshes/dataset (scripts/remesh_ct.py), clean CT meshes in the CT frame of the
# original lab simulations: X forward, Y left, Z up, metres. Landmarks in that frame, in metres.
# emitter: "nasal" (two nostrils, BEM) or "oral" (analytical piston at the mouth, radius calibrated to the literature).
# Earlier working-frame configuration (remeshed meshes): /data/BatERTF/work/species_working_frame.toml

[species.pdisc]   # head in the pose of De Mey et al. 2008, about 33 deg from the CT scan (scripts/rotate_pdisc_pose.py)
name = "Phyllostomus discolor"
stl = "../dataset/Phyllostomus_discolor.stl"
family = "Phyllostomidae"
emitter = "nasal"
band_khz = [20, 145, 0.5]   # dataset band, 0.5 kHz steps; upper limit 160 kHz or six mean-size elements per wavelength
reference = "HRTF_Phyllostomus_Discolor.mat"
nose_centre = [1.301784e-02, 1.951469e-03, -1.306155e-02]   # search centre for nostril candidates

[species.pdisc.landmarks]   # best match to the reference ERTFs (scripts/placement_study.py; corr L/R/E 0.78/0.83/0.81)
ear_left = [-1.127247e-02, 7.207450e-03, -1.286368e-03]
ear_right = [-1.024794e-02, -9.444119e-03, -4.423367e-03]
nostrils = [[1.293555e-02, 1.705477e-03, -1.148249e-02], [1.269087e-02, 3.662645e-03, -1.144696e-02]]

[species.pdisc.frames.ct]
rotation = [0.0, 0.0, 0.0]

[species.pdisc.frames.reference]   # = the dataset frame: the mesh is in the pose of De Mey et al. 2008 (scripts/rotate_pdisc_pose.py)
rotation = [0.0, 0.0, 0.0]

[species.mmicr]
name = "Micronycteris microtus"   # spelling of the mesh files, kept for traceability
taxon = "Micronycteris microtis"   # verified scientific name, used in the paper
stl = "../dataset/Micronycteris_microtus.stl"
family = "Phyllostomidae"
emitter = "nasal"
band_khz = [20, 160, 0.5]   # dataset band, 0.5 kHz steps; upper limit 160 kHz or six mean-size elements per wavelength
reference = "HRTF_Micronycteris_Microtis.mat"
nose_centre = [2.728678e-03, 9.313051e-05, -7.305756e-03]   # search centre for nostril candidates

[species.mmicr.landmarks]   # best match to the reference ERTFs (scripts/placement_study.py; corr L/R/E 0.94/0.92/0.93)
ear_left = [-7.990941e-03, 4.413554e-03, 1.228284e-03]
ear_right = [-7.438269e-03, -5.791357e-03, 7.787496e-04]
nostrils = [[2.227055e-03, -1.075397e-03, -8.407248e-03], [1.807708e-03, 7.904584e-04, -8.806909e-03]]

[species.mmicr.frames.ct]
rotation = [0.0, 0.0, 0.0]

[species.mmacr]
name = "Macrophyllum macrophyllum"
stl = "../dataset/Macrophyllum_macrophyllum.stl"
family = "Phyllostomidae"
emitter = "nasal"
band_khz = [20, 160, 0.5]   # dataset band, 0.5 kHz steps; upper limit 160 kHz or six mean-size elements per wavelength
nose_centre = [4.074618e-03, -3.054999e-04, -2.935589e-03]   # search centre for nostril candidates

[species.mmacr.landmarks]   # placement rule learned on pdisc/mmicr (scripts/apply_placement_rule.py)
ear_left = [-5.464500e-03, 5.071800e-03, -1.251000e-04]
ear_right = [-5.088700e-03, -3.688200e-03, 5.800000e-06]
nostrils = [[3.082654e-03, 1.940526e-03, -6.056132e-03], [2.742500e-03, -2.307500e-04, -6.056150e-03]]

[species.mmacr.frames.ct]
rotation = [0.0, 0.0, 0.0]

