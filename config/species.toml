[species.efusc]
name = "Eptesicus fuscus"
stl = "../dataset/Eptesicus_fuscus.stl"
family = "Vespertilionidae"
emitter = "oral"
band_khz = [20, 160, 0.5]   # dataset band, 0.5 kHz steps; upper limit 160 kHz or six mean-size elements per wavelength
mouth = [1.145854e-02, -4.154834e-04, -5.030461e-03]   # lip seam, midline (picked on the earlier mesh, carried over)
piston_radius_m = 0.00659
piston_calibration = "field: 30 deg half-amplitude angle at 35 kHz (Hulgard et al. 2016)"
piston_alternatives_m = [0.00367]   # emitter_alt1: wide beam, calibrated radius scaled by the M. daubentonii ratio 3.5/6.28
piston_alternatives_note = ["wide (confined-space) beam: not calibrated for this species; radius scaled by the ratio of the in-flight (Hafele et al. 2026) to the field radius found for M. daubentonii"]

[species.efusc.landmarks]   # placement rule learned on pdisc/mmicr (scripts/apply_placement_rule.py)
ear_left = [-4.517900e-03, 5.739500e-03, -6.899500e-03]
ear_right = [-4.217300e-03, -4.271700e-03, -6.341200e-03]
