[species.efusc]
name = "Eptesicus fuscus"
stl = "../dataset/Eptesicus_fuscus.stl"
family = "Vespertilionidae"
emitter = "oral"
band_khz = [20, 160, 0.5]   # dataset band, 0.5 kHz steps; upper limit 160 kHz or six mean-size elements per wavelength
mouth = [1.145854e-02, -4.154834e-04, -5.030461e-03]   # lip seam, midline (picked on the earlier mesh, carried over)
piston_radius_m = 0.00659
piston_calibration = "field: 30 deg half-amplitude angle at 35 kHz (Hulgard et al. 2016)"
piston_alternatives_m = [0.0025, 0.0035, 0.0045, 0.0055, 0.0065]   # emitter_alt1..5: the piston for other behaviours (parametric emitter)
piston_alternatives_note = ["2.5 mm: wider than any measured beam (close range)", "3.5 mm: laboratory and wind-tunnel beams (M. daubentonii: 3.1 mm laboratory, Surlykke et al. 2009; 3.5 mm in flight, Hafele et al. 2026)", "4.5 mm: intermediate (E. fuscus laboratory beam: 4.7 mm, Hartley and Suthers 1989)", "5.5 mm: intermediate", "6.5 mm: open-field search beam (calibrated radii 6.28 and 6.59 mm)"]

[species.efusc.landmarks]   # placement rule learned on pdisc/mmicr (scripts/apply_placement_rule.py)
ear_left = [-4.517900e-03, 5.739500e-03, -6.899500e-03]
ear_right = [-4.217300e-03, -4.271700e-03, -6.341200e-03]
mouth = [1.145854e-02, -4.154834e-04, -5.030461e-03]

[species.efusc.frames.ct]
rotation = [0.0, 0.0, 0.0]

