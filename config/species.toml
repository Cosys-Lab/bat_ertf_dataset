ear_right = [-3.695800e-03, -6.936300e-03, 1.409400e-03]
nostrils = [[3.163351e-03, -5.003253e-04, -1.218633e-02], [3.197150e-03, 1.448000e-03, -1.230052e-02]]   # second choice of the rule: in the nostril openings, single main lobe as Vanderelst et al. 2013 (first choice, now emitter_alt1: [4.390100e-03, 1.661200e-03, -1.069110e-02], [4.395530e-03, -2.819028e-04, -1.025522e-02])

[species.rform.frames.ct]
